<header class="site-header" role="banner">
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="site-logo" aria-label="{{ site.driver.name }} — Home">
      <span class="logo-avatar" aria-hidden="true" style="font-size:1.8rem;display:flex;align-items:center;">🚗</span>
      <span class="logo-text">
        <span class="logo-name">{{ site.driver.name }}</span>
        <span class="logo-tagline">Sri Lanka Private Driver</span>
      </span>
    </a>

    <nav class="site-nav" id="site-nav" role="navigation" aria-label="Main navigation">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>
          {{ item.title }}
        </a>
      {% endfor %}
      <a href="{{ '/contact/' | relative_url }}"
         class="nav-cta"
         {% if page.url == '/contact/' %}aria-current="page"{% endif %}>
        Get a Quote
      </a>
    </nav>

    <button class="nav-toggle"
            id="nav-toggle"
            aria-controls="site-nav"
            aria-expanded="false"
            aria-label="Toggle navigation menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
