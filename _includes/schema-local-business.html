<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "LocalBusiness",
  "@id": "{{ site.url }}{{ site.baseurl }}/#business",
  "name": {{ site.title | jsonify }},
  "description": {{ site.description | strip_newlines | strip | jsonify }},
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "telephone": {{ site.driver.phone | jsonify }},
  "image": "{{ site.url }}{{ site.baseurl }}/assets/images/mifras_with_van.jpg",
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "addressCountry": "LK"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": 7.8731,
    "longitude": 80.7718
  },
  "areaServed": {
    "@type": "Country",
    "name": "Sri Lanka"
  },
  "openingHoursSpecification": {
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
    "opens": "00:00",
    "closes": "23:59"
  }
}
</script>
